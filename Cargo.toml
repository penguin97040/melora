[workspace]
members = ["src-tauri", "ora/crates/*"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.99"

[workspace.dependencies]
tauri = { version = "=2.12.3", features = [] }
tauri-build = { version = "=2.7.2", features = [] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
ts-rs = "=12.0.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
