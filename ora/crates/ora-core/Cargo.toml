[package]
name = "ora-core"
version = "0.1.0"
description = "Tauri-free Spotify logic for Melora"
edition.workspace = true
rust-version.workspace = true
publish = false

# Never add `tauri` here: scripts/check-ora-boundaries.sh fails the check if it appears.
[dependencies]
ora-types = { path = "../ora-types" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
url = { workspace = true }
getrandom = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
zeroize = { workspace = true }
open = { workspace = true }
keyring-core = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { workspace = true }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
zbus-secret-service-keyring-store = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
